<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Updater · end-to-end check</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px 16px; background: #f3f4f7; color: #18202e; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #667085; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 0; background: #1f3b6e; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  pre { background: #111827; color: #e5e7eb; padding: 14px; border-radius: 10px; white-space: pre-wrap;
        word-break: break-word; font: 12.5px/1.5 ui-monospace, Consolas, monospace; min-height: 120px; }
</style>
</head>
<body>
<main>
  <h1>End-to-end check (test copy only)</h1>
  <p>Pushes one brief, one PAR and two Collections changes (a new row, and a row moved along), ignores and restores
     one brief, then compares every stored field of all five tables before and after. Runs as the user logged in on
     the main page in this tab.</p>
  <button id="run" type="button">Run the check</button>
  <button id="runAndon" type="button">Run the ANDON check</button>
  <pre id="out"></pre>
</main>
<script type="module">
  import { runE2E, runAndonE2E } from "./e2e-core.js";
  import { TABLE_LINKS, ENV_LABEL } from "../js/config.js";
  import { parseBaseLink } from "../js/ops.js";

  const out = document.getElementById("out");
  const log = (line) => { out.textContent += line + "\n"; };
  const read = (area, key) => { try { return JSON.parse(window[area + "Storage"].getItem(key)); } catch { return null; } };
  const override = (() => { try { return localStorage.getItem("polaris.proxyOverride"); } catch { return null; } })();
  const proxy = (override || "https://lark-proxy-dwiw.onrender.com").replace(/\/+$/, "");
  const tok = read("session", "polaris.token");
  const T = Object.fromEntries(Object.entries(TABLE_LINKS).map(([k, l]) => [k, parseBaseLink(l)]));

  async function call(method, url, body) {
    const init = { method, headers: { Authorization: "Bearer " + tok.access_token } };
    if (method !== "GET") { init.headers["Content-Type"] = "application/json; charset=utf-8"; init.body = JSON.stringify(body || {}); }
    const res = await fetch(`${proxy}/proxy?url=${encodeURIComponent(url)}`, init);
    const j = JSON.parse(await res.text());
    if (Number(j.code) !== 0) { const e = new Error(`Lark ${j.code}: ${j.msg}`); e.json = j; throw e; }
    return j;
  }

  const btn = document.getElementById("run");
  if (!tok || !tok.access_token || tok.expires_at < Date.now() + 60000) {
    btn.disabled = true;
    log("Not logged in (or the login is about to expire). Log in on ../ in this same tab, then come back.");
  } else if (ENV_LABEL !== "Test copy") {
    btn.disabled = true;
    log(`js/config.js points at "${ENV_LABEL}", not the test copy. This check only runs on the test copy.`);
  }
  let armed = false;
  btn.addEventListener("click", async () => {
    if (!armed) {   // two clicks, no popup: the first only arms it
      armed = true;
      btn.textContent = "Click again to write to the test copy";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Running…";
    out.textContent = "";
    try {
      const failures = await runE2E(call, T, log);
      document.title = failures ? "E2E FAILED" : "E2E passed";
    } catch (e) {
      log("\nStopped with an error: " + e.message + (e.json ? "\n" + JSON.stringify(e.json, null, 2) : ""));
      document.title = "E2E error";
    }
  });
  const btnA = document.getElementById("runAndon");
  btnA.disabled = btn.disabled;
  let armedA = false;
  btnA.addEventListener("click", async () => {
    if (!armedA) { armedA = true; btnA.textContent = "Click again to write to the ANDON test copy"; return; }
    btnA.disabled = true;
    btnA.textContent = "Running…";
    out.textContent = "";
    try { const f = await runAndonE2E(call, T, log); document.title = f ? "ANDON E2E FAILED" : "ANDON E2E passed"; }
    catch (e) { log("\nStopped with an error: " + e.message + (e.json ? "\n" + JSON.stringify(e.json, null, 2) : "")); document.title = "ANDON E2E error"; }
  });
</script>
</body>
</html>
